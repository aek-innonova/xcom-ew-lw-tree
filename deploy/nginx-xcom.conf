# xcom.innonova.ch: the Long War tech tree, static files built by `npm run build`.
# Installed on www (192.168.80.89) as /etc/nginx/sites-available/xcom.innonova.ch,
# linked from sites-enabled. TLS is terminated at the estate ingress, which
# forwards plain HTTP to port 80 with the Host header.
# Vite's hashed assets never change under the same name; everything else
# (index.html above all) is revalidated. A map, because an add_header inside a
# location would drop the server-level security headers.
map $uri $xcom_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    server_name xcom.innonova.ch;

    root /srv/xcom;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    add_header X-Content-Type-Options nosniff always;
    # connect-src backs the promise in the UI: saves and INIs are read in the
    # browser and the page cannot send them anywhere off the machine. The one
    # other address is the player's own helper program on 127.0.0.1
    # (helper/main.go, features/game-tools.md).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:47801; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    add_header Cache-Control $xcom_cache_control always;

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
