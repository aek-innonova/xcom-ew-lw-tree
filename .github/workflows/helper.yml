# On a helper tag (helper-v1.0.0): test the helper (helper/main.go), build it
# for Windows, Linux and macOS, sign the checksums keyless with cosign
# (Sigstore) under this workflow's identity as the site's release does, and
# publish a GitHub release that is not marked latest (the site's own v*
# releases stay "latest"; the Tools page links the helper's release by tag).
name: helper
on:
  push:
    tags: ["helper-v*"]
permissions:
  contents: write   # create the release
  id-token: write   # keyless signing
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: helper/go.mod }
      - run: go vet ./... && go test ./...
        working-directory: helper
      - name: build
        working-directory: helper
        run: |
          v="${GITHUB_REF_NAME#helper-v}"
          for t in windows/amd64 linux/amd64 darwin/arm64 darwin/amd64; do
            os="${t%/*}"; arch="${t#*/}"; ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$v" -o "../out/lwtree-helper-$os-$arch$ext" .
          done
          cd ../out && sha256sum lwtree-helper-* > SHA256SUMS
      - uses: sigstore/cosign-installer@v4.1.2
      - name: sign
        run: cosign sign-blob --yes --bundle out/SHA256SUMS.sigstore.json out/SHA256SUMS
      - name: release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" --latest=false --title "Helper ${GITHUB_REF_NAME#helper-v}" \
            --notes "The Tools page's helper program (helper/README.md). Check a download against SHA256SUMS." \
            out/*
