# The desktop app's Windows installer, built and code-signed (features/production.md).
# Run by hand (Actions, "desktop", Run workflow) with the channel and the update
# server the app should take its updates from. It runs in the "production"
# environment: Azure's federated credential trusts that environment of this
# repository, so the job signs with Azure Artifact Signing, no secret held
# anywhere. electron-builder signs the app's exe, the uninstaller and the
# installer.
#
# The installer comes out as the run's artifact. Our own Ed25519 signature
# (the one the app checks its updates against) is added afterwards, on the
# machine that holds that key: download the artifact into desktop/release/
# (staging) or desktop/release/<channel>/, then deploy/deploy.sh or
# deploy/publish-desktop.sh <channel> as before. The order matters: that
# signature is over the installer's final, Authenticode-signed bytes.
#
# The environment's variables (none of them secret):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID   the app registration with the federated credential
#   AZURE_SUBSCRIPTION_ID              optional
#   SIGNING_ENDPOINT                   e.g. https://weu.codesigning.azure.net
#   SIGNING_ACCOUNT                    the Artifact Signing account
#   SIGNING_PROFILE                    its certificate profile
name: desktop
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel the app follows
        default: staging
      update_url:
        description: Update server (https) the app asks for bundle/<channel>.json
        default: https://xcom.innonova.ch
permissions:
  contents: read
  id-token: write # the federated credential
jobs:
  installer:
    runs-on: windows-2025
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: where updates come from
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          URL: ${{ inputs.update_url }}
        run: |
          [[ "$CHANNEL" =~ ^[a-z]+$ && "$URL" =~ ^https://[A-Za-z0-9./_-]+$ ]] || { echo "bad channel or url" >&2; exit 1; }
          printf '{ "url": "%s", "channel": "%s" }\n' "$URL" "$CHANNEL" > desktop/update.json
          cat desktop/update.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      # The base bundle as scripts/build-desktop-win.sh makes it: the site built,
      # copied with its version stamped (copy-site.mjs), the app compiled.
      - run: npm run site && npm run build
        working-directory: desktop
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ vars.AZURE_SUBSCRIPTION_ID == '' }}
      - name: build and sign
        working-directory: desktop
        shell: bash
        env:
          ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: >
          npx electron-builder --win nsis
          -c.win.signExecutable=true
          "-c.win.azureSignOptions.endpoint=$ENDPOINT"
          "-c.win.azureSignOptions.codeSigningAccountName=$ACCOUNT"
          "-c.win.azureSignOptions.certificateProfileName=$PROFILE"
      - name: the signatures hold
        shell: pwsh
        run: |
          $files = @(Get-ChildItem desktop/release/LongWarTechTree-Setup-*.exe) + @(Get-ChildItem desktop/release/win-unpacked/*.exe)
          $bad = $false
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            "{0}: {1} ({2})" -f $f.Name, $s.Status, $s.SignerCertificate.Subject
            if ($s.Status -ne 'Valid') { $bad = $true }
          }
          if ($bad) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: desktop/release/LongWarTechTree-Setup-*.exe
          if-no-files-found: error
