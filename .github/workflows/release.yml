# On a version tag: test and build the site, pack dist/, sign the tarball
# keyless with cosign (Sigstore) under this workflow's identity, and publish
# it as a GitHub release. The estate's nginx host (innonova/iac, the site
# xcom.aek.dk of kind release) verifies the bundle before serving it; the
# tag it serves is in iac's environments/<env>/versions.yml.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write   # create the release
  id-token: write   # keyless signing
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:unit -- --run
      - run: npm run build
      - name: pack
        run: |
          tar -czf xcom-dist.tar.gz -C dist .
          sha256sum xcom-dist.tar.gz > xcom-dist.tar.gz.sha256
      - uses: sigstore/cosign-installer@v4.1.2
      - name: sign
        run: cosign sign-blob --yes --bundle xcom-dist.tar.gz.sigstore.json xcom-dist.tar.gz
      - name: release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "xcom.aek.dk $GITHUB_REF_NAME" xcom-dist.tar.gz xcom-dist.tar.gz.sha256 xcom-dist.tar.gz.sigstore.json
